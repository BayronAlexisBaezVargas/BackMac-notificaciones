spring:
  application:
    name: ms-notificaciones
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/notificaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:springuser}
    password: ${SPRING_DATASOURCE_PASSWORD:springpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/c59a4270-0c88-46d9-a708-38639783c0b1/discovery/v2.0/keys
          audiences:
            - 24a66d14-c9c3-41c1-a93b-7e5926389c91
            - api://24a66d14-c9c3-41c1-a93b-7e5926389c91

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        acknowledge-mode: manual

server:
  port: 8085

# Centralized RabbitMQ configuration for Evaluation 3
app:
  rabbitmq:
    exchange: pedidos360.exchange
    dlx: pedidos360.dlx
    queues:
      notificaciones: notificaciones.queue
      dlq: notificaciones.dlq
    routing-keys:
      notificaciones: notificaciones.routing.key
      dlq: notificaciones.dlq.routing.key
